<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Luxury Gallery</title>
  <style>
    @import url('https://googleapis.com');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121214;
      background-image: radial-gradient(circle at 50% 50%, #1e1e24 0%, #121214 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 35px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-link { text-decoration: none; color: inherit; display: block; }

    .product-card {
      background: #1a1a1e;
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 20px;
      width: 310px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .product-card:hover {
      transform: translateY(-10px);
      border-color: #d4af37;
      box-shadow: 0 25px 50px rgba(212, 175, 55, 0.15);
    }

    .img-container { width: 100%; height: 270px; overflow: hidden; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
    .product-card:hover img { transform: scale(1.06); }
    .card-info { padding: 22px; background: #1a1a1e; display: flex; justify-content: center; }

    .price-tag {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid #d4af37;
      padding: 8px 24px;
      border-radius: 100px;
      color: #d4af37;
      font-size: 1.35rem;
      font-weight: 700;
      transition: all 0.3s;
    }

    .product-card:hover .price-tag {
      background: #d4af37;
      color: #121214;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" class="product-link">
      <div class="product-card">
        <div class="img-container"><img src="11.jpeg" alt="Product"></div>
        <div class="card-info"><div class="price-tag">₹600</div></div>
      </div>
    </a>
    <a href="#" class="product-link">
      <div class="product-card">
        <div class="img-container"><img src="17850456171697815820325540560804.jpg" alt="Product"></div>
        <div class="card-info"><div class="price-tag">₹380</div></div>
      </div>
    </a>
    <a href="#" class="product-link">
      <div class="product-card">
        <div class="img-container"><img src="17850457197101568217548325837947.jpg" alt="Product"></div>
        <div class="card-info"><div class="price-tag">₹280</div></div>
      </div>
    </a>
  </div>
</body>
</html>
